name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-h2:
    name: Tests (H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify

  test-postgres:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: stockroom
          POSTGRES_USER: stockroom
          POSTGRES_PASSWORD: stockroom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockroom -d stockroom"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run the same test suite against a real PostgreSQL database
        run: ./mvnw -B verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/stockroom
          SPRING_DATASOURCE_USERNAME: stockroom
          SPRING_DATASOURCE_PASSWORD: stockroom

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t stockroom-api .
